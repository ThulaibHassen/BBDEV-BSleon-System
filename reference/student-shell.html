</head>
<body>
<div class="splash gone" id="splash" role="status" aria-live="polite" onclick="hideSplash()">
 <svg class="sp-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.7 1 1.6 1 2.5h6c0-.9.2-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>
 <div class="sp-name">BS With Leon</div>
 <div class="sp-line" id="spLine"></div>
 <div class="sp-foot" id="spFoot"></div>
</div>
<div class="statusfill" aria-hidden="true"></div>

<!-- LOGIN. Demo credentials only, see the STUDENTS note in the script. -->
<div class="login" id="login">
 <div class="login-in">
  <div class="lg-stage" id="lgStage" aria-hidden="true"><canvas id="lgField"></canvas><img class="lg-logo" id="lgLogo" src="mark.png" alt=""></div>
  <h1 class="lg-t">BS With Leon</h1>
  <p class="lg-s">Sign in to your study app</p>
  <form id="lgForm" autocomplete="off">
   <label for="lgUser">Your name</label>
   <input id="lgUser" name="lgUser" autocapitalize="words" autocomplete="username" placeholder="Amaya">
   <label for="lgPin" style="margin-top:var(--s4)">Your code</label>
   <input id="lgPin" name="lgPin" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digits">
   <p class="lg-err" id="lgErr" role="alert"></p>
   <button class="btn btn-primary" type="submit" style="margin-top:var(--s5)">Sign in</button>
  </form>
  <p class="lg-foot">Ask Leon for a code. Each one works once.</p>
 </div>
</div>

<div class="offline-bar" id="offlineBar" role="status">Offline. Your work is saved on this device.</div>

<header class="hdr">
 <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.7 1 1.6 1 2.5h6c0-.9.2-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>
 <div class="grow" style="flex:1"><h1 id="hdrTitle">Today</h1><div class="sub" id="hdrSub"></div></div>
 <button class="bell" aria-label="Updates" onclick="openInbox()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/></svg>
  <span class="bb" id="bellBadge" hidden></span>
 </button>
</header>

<!-- UPDATES -->
<div class="inboxw" id="inboxw" role="dialog" aria-modal="true" aria-label="Updates">
 <div class="ib-top">
  <button class="ic-btn" style="width:40px;height:40px;border-radius:var(--r-pill);background:var(--surface-2);display:flex;align-items:center;justify-content:center" aria-label="Back" onclick="closeInbox()">
   <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h2 style="flex:1">Updates</h2>
 </div>
 <div class="ib-body">
  <div class="chipbar" id="ibChips" role="group" aria-label="Filter updates"></div>
  <div id="ibList" style="margin-top:var(--s3)"></div>
 </div>
</div>

<main class="shell" id="main">

 <!-- ══ DO NEXT ══ -->
 <section class="screen on" id="sc-next" role="tabpanel" aria-labelledby="tab-next">
  <div id="nextSlot" class="stack"></div>
 </section>

 <!-- ══ LEARN ══ -->
 <section class="screen" id="sc-learn" role="tabpanel" aria-labelledby="tab-learn">
  <div class="seg" role="tablist" aria-label="Learn sections" id="learnSeg">
   <button role="tab" aria-selected="true" data-seg="syllabus">Syllabus</button>
   <button role="tab" aria-selected="false" data-seg="tutes">Tutes</button>
   <button role="tab" aria-selected="false" data-seg="papers">Papers</button>
   <button role="tab" aria-selected="false" data-seg="recordings">Recordings</button>
  </div>
  <div id="segSyllabus" style="margin-top:var(--s4)">
   <div class="chipbar" role="group" aria-label="Filter topics" id="sylFilters"></div>
   <div id="sylBody" class="stack" style="margin-top:var(--s3)"></div>
  </div>
  <div id="segTutes" style="display:none;margin-top:var(--s4)"><div id="tuteBody" class="stack"></div></div>
  <div id="segPapers" style="display:none;margin-top:var(--s4)"><div id="paperBody" class="stack"></div></div>
  <div id="segRecordings" style="display:none;margin-top:var(--s4)"><div id="recBody" class="stack"></div></div>
 </section>

 <!-- ══ PRACTICE ══ everything you sit rather than read -->
 <section class="screen" id="sc-practice" role="tabpanel" aria-labelledby="tab-practice">
  <div class="ph-grid" id="pracTiles" role="tablist" aria-label="Practice sections"></div>
  <div id="pracTests" style="margin-top:var(--s5)"><div id="mcqBody" class="stack"></div></div>
  <div id="pracEssays" style="display:none;margin-top:var(--s5)"><div id="essBody" class="stack"></div></div>
 </section>

 <!-- ══ PROGRESS ══ -->
 <section class="screen" id="sc-progress" role="tabpanel" aria-labelledby="tab-progress">
  <div id="progressSlot" class="stack"></div>
 </section>
</main>

<nav class="tabs" role="tablist" aria-label="Main">
 <i class="pill" id="tabPill" aria-hidden="true"></i>
 <button role="tab" id="tab-next" aria-selected="true" aria-controls="sc-next" data-sc="next">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4.5 13H11l-.5 9L20 10.5h-6.5z"/></svg><span class="lbl">Today</span></button>
 <button role="tab" id="tab-learn" aria-selected="false" aria-controls="sc-learn" data-sc="learn">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M9 7.5h6M9 11h4"/></svg><span class="lbl">Learn</span></button>
 <button role="tab" id="tab-practice" aria-selected="false" aria-controls="sc-practice" data-sc="practice">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8.4"/><path d="M12 1.5v2.6M12 19.9v2.6M22.5 12h-2.6M4.1 12H1.5"/></svg><span class="lbl">Practice</span></button>
 <button role="tab" id="tab-progress" aria-selected="false" aria-controls="sc-progress" data-sc="progress">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20v-6M12 20V4M19 20v-9"/></svg><span class="lbl">Progress</span></button>
</nav>

<!-- task flow -->
<div class="flow" id="flow" role="dialog" aria-modal="true" aria-label="Study task">
 <div class="flow-top">
  <button class="ic-btn" id="flowBack" aria-label="Go back">
   <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="flow-prog"><i id="flowProg" style="width:0%"></i></div>
  <button class="ic-btn" id="flowExit" aria-label="Close and save for later">
   <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
 </div>
 <div class="flow-body" id="flowBody"></div>
 <div class="flow-foot" id="flowFoot"></div>
</div>

<!-- ══ CLASS QUIZ ══ -->
<div class="qg" id="qgWrap" role="dialog" aria-modal="true" aria-label="Class quiz">
 <div class="qg-top"><span class="m" id="qgTitle"></span><button class="qg-x" onclick="QGAME.leave()">Leave</button></div>
 <div class="qg-mid" id="qgMid"></div>
</div>

<!-- ══ MCQ PAPER ══ -->
<div class="mq" id="mqWrap" role="dialog" aria-modal="true" aria-label="MCQ paper">
 <div class="mq-top"><span class="m" id="mqTitle"></span>
  <span class="mq-clock" id="mqClock" aria-live="off"></span>
  <button class="qg-x" id="mqLeave" onclick="MQ.leave()">Leave</button></div>
 <div class="mq-bar"><i id="mqTimeBar" style="width:100%"></i></div>
 <div class="mq-body" id="mqBody"></div>
 <div class="mq-foot" id="mqFoot"></div>
</div>

<!-- sheet -->
<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="grabber"></div><div id="sheetBody"></div></div></div>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAct" hidden>Undo</button></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
