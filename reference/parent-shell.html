</head>
<body>

<div class="login" id="login">
 <div class="login-in">
  <div class="lg-stage" id="lgStage" aria-hidden="true"><canvas id="lgField"></canvas><img class="lg-logo" id="lgLogo" src="mark.png" alt=""></div>
  <h1 class="lg-t">BS With Leon</h1>
  <p class="lg-s">Parent access &mdash; fees, attendance and how the class is going</p>
  <form id="pForm" autocomplete="off">
   <label for="pChild">Your child&rsquo;s name</label>
   <input id="pChild" autocapitalize="words" autocomplete="off" placeholder="Amaya">
   <label for="pCode" style="margin-top:var(--s4)">The code from Leon</label>
   <input id="pCode" inputmode="numeric" maxlength="6" placeholder="6 digits">
   <p class="lg-err" id="pErr" role="alert"></p>
   <button class="btn btn-primary" type="submit" style="margin-top:var(--s5)">Sign in</button>
  </form>
  <p class="lg-foot">Ask Leon or Bihandu for a code. It lasts a day, and it works on more than one phone.</p>
 </div>
</div>

<header class="hdr" id="shellHdr" hidden>
 <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.7 1 1.6 1 2.5h6c0-.9.2-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>
 <div class="grow" style="flex:1"><h1 id="hdrTitle">Fees</h1><div class="sub" id="hdrSub"></div></div>
 <button class="out" onclick="PAR.out()">Sign out</button>
</header>

<main class="shell" id="main" hidden>
 <section class="screen on" id="sc-fees" role="tabpanel" aria-labelledby="tab-fees"><div id="pFees" class="stack"></div></section>
 <section class="screen" id="sc-att" role="tabpanel" aria-labelledby="tab-att"><div id="pAtt" class="stack"></div></section>
 <section class="screen" id="sc-class" role="tabpanel" aria-labelledby="tab-class"><div id="pClass" class="stack"></div></section>
 <section class="screen" id="sc-settings" role="tabpanel" aria-labelledby="tab-settings"><div id="pSettings" class="stack"></div></section>
</main>

<nav class="tabs" id="pDock" role="tablist" aria-label="Main" hidden>
 <i class="pill" id="tabPill" aria-hidden="true"></i>
 <button role="tab" id="tab-fees" aria-selected="true" aria-controls="sc-fees" data-sc="fees">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span class="lbl">Fees</span></button>
 <button role="tab" id="tab-att" aria-selected="false" aria-controls="sc-att" data-sc="att">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg><span class="lbl">Attendance</span></button>
 <button role="tab" id="tab-class" aria-selected="false" aria-controls="sc-class" data-sc="class">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15.5H6.5A2.5 2.5 0 0 0 4 21z"/><path d="M9 7.5h6M9 11h4"/></svg><span class="lbl">Class</span></button>
 <button role="tab" id="tab-settings" aria-selected="false" aria-controls="sc-settings" data-sc="settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.9 15a1.7 1.7 0 0 0 .34 1.87 2 2 0 1 1-2.83 2.83 1.7 1.7 0 0 0-2.87 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.93-1.15 2 2 0 1 1-2.83-2.83A1.7 1.7 0 0 0 3.1 14a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.15-2.93 2 2 0 1 1 2.83-2.83A1.7 1.7 0 0 0 10 3.1a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.93 1.15 2 2 0 1 1 2.83 2.83A1.7 1.7 0 0 0 20.9 10a2 2 0 1 1 0 4 1.7 1.7 0 0 0-1 1z"/></svg><span class="lbl">Settings</span></button>
</nav>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span></div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
